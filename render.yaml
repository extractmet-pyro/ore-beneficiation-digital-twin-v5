# Render Blueprint — the OPERATOR DESK (static site) only.
#
#   Render dashboard → New + → Blueprint → connect this repository → Apply.
#
# The backend is deployed separately as a Web Service (see README §"Deploying to Render", or
# chapter 5 of the deployment guide). That split is deliberate: the API and the desk have
# different lifecycles, different plans and different scaling needs, and keeping the API as a
# hand-made service means a blueprint re-apply can never disturb it.
#
# To deploy BOTH from one blueprint instead, rename render.full.yaml over this file.
#
# ---------------------------------------------------------------------------------------------
# BACKEND_BASE_URL is the one setting that matters. Render prompts for it when you apply this
# blueprint because of `sync: false`. It must be the API service's full URL, https, with NO
# trailing slash — for example  https://obdt-v5-api.onrender.com
#
# Get it wrong and the desk still loads, but every call fails at the network layer and it falls
# back to the captured demonstration payloads: the desk shows "MOCK fallback, backend
# unreachable". The build log prints a loud warning if it is left unset.
# ---------------------------------------------------------------------------------------------

services:
  - type: web
    name: obdt-v5-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: node scripts/write-config.mjs
    staticPublishPath: .
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /data/mock/*
        name: Cache-Control
        value: public, max-age=86400
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /data/mock/*
        name: Content-Type
        value: application/octet-stream
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_BASE_URL
        sync: false             # REQUIRED — the API service URL, https, no trailing slash
      - key: APP_ENV
        value: production
      - key: MOCK_MODE
        value: auto             # auto = fall back to captured payloads if the API is asleep
      - key: API_KEY
        sync: false             # optional; must match the API. Visible to browser users.
      - key: AUTH_MODE
        value: none
      - key: APP_PASSWORD
        sync: false             # only used when AUTH_MODE=password
      - key: REQUEST_TIMEOUT_S
        value: "60"             # a cold free-plan API takes ~60 s to answer its first request
      - key: LONG_TIMEOUT_S
        value: "300"            # validation suite and hybrid training are slow on a cold start
