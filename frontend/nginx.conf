server {
  listen       ${PORT};
  server_name  _;
  root   /usr/share/nginx/html;
  index  index.html;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  types { application/javascript js mjs; }
  location = /config.js { add_header Cache-Control "no-cache"; }
  location /data/mock/ { default_type application/octet-stream; gzip off; }
  location /vendor/ { add_header Cache-Control "public, max-age=604800"; }
  location / { try_files $uri $uri/ /index.html; }
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
}
